name: AI Lockfile Update

on:
  push:
    branches:
      - yl-102-background-removal-browser
    paths:
      - package.json
      - .github/workflows/ai-lockfile.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: yl-102-background-removal-browser
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update package lock only
        run: npm install @huggingface/transformers@4.3.0 --save-exact --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(ai): lock Transformers.js 4.3.0"
          git push origin HEAD:yl-102-background-removal-browser
