name: Shop CI

on:
  push:
    branches:
      - main
      - commerce-stage9
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Offline verification
        run: npm run verify:offline
      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3101 > /tmp/yashlaser-next.log 2>&1 &
          echo $! > /tmp/yashlaser-next.pid
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3101/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/yashlaser-next.log
          exit 1
      - name: Route and API smoke verification
        run: npm run check:routes -- http://127.0.0.1:3101
      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/yashlaser-next.pid ]; then
            kill "$(cat /tmp/yashlaser-next.pid)" || true
          fi
